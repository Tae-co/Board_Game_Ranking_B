spring.config.import=optional:file:.env.local[.properties]

server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:54322/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# HikariCP - Supabase 원격 DB 최적화
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=60000
# Supabase Storage
supabase.url=${SUPABASE_URL:http://127.0.0.1:54321}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
supabase.storage.bucket=community-images
supabase.storage.profile-bucket=profile-images
# Apple 로그인 - identityToken의 aud 검증 대상 (iOS Bundle ID)
apple.client-id=${APPLE_CLIENT_ID:com.taeco.YadaRank}
# JWT
# 기본값(fallback)을 두지 않는다. JWT_SECRET 미설정 시 공개된 문자열로 조용히 서명하는 대신
# 기동 자체를 실패시킨다(fail-loud). 로컬은 application-local.properties가 jwt.secret을 채운다. (#5)
jwt.secret=${JWT_SECRET}
jwt.access-expiration=1800000
jwt.refresh-expiration=604800000
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.ignore-migration-patterns=*:failed
