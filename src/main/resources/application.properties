spring.config.import=optional:file:.env.local[.properties]

server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:54322/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# HikariCP - Supabase 원격 DB 최적화
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=60000
# Supabase Storage
supabase.url=${SUPABASE_URL:http://127.0.0.1:54321}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
supabase.storage.bucket=community-images
supabase.storage.profile-bucket=profile-images
# Apple 로그인 - identityToken의 aud 검증 대상 (iOS Bundle ID)
apple.client-id=${APPLE_CLIENT_ID:com.taeco.YadaRank}
# JWT
# 기본값(fallback)을 두지 않는다. JWT_SECRET 미설정 시 공개된 문자열로 조용히 서명하는 대신
# 기동 자체를 실패시킨다(fail-loud). 로컬은 application-local.properties가 jwt.secret을 채운다. (#5)
jwt.secret=${JWT_SECRET}
jwt.access-expiration=1800000
jwt.refresh-expiration=604800000
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# 운영 스키마는 과거 ddl-auto=update로 만들어져 flyway_schema_history가 없다. baseline-version 없이
# 켜면 기본값 1로 baseline돼 V2~V12가 재실행되는데, V4(레이팅 전체 초기화)와 V10(best_display_score -1000)은
# 비멱등이라 운영 데이터가 파괴된다.
# 메인라인의 마지막 마이그레이션인 12로 고정한다. 14로 두면 feature/paywall-fake-door가 예약한
# V13·V14가 baseline 이하가 되어 영구히 건너뛰어진다.
# 빈 스키마(로컬)에는 baseline 자체가 적용되지 않으므로 V1부터 정상 실행된다.
spring.flyway.baseline-version=12
spring.flyway.ignore-migration-patterns=*:failed
